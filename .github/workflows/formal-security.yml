        run: |
          DAFNY_CRYPTO_TOOL=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          python - "$DAFNY_CRYPTO_TOOL" <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.argv[1], 'audit', 'formal/crypto/Polynomial.dfy'], text=True, capture_output=True)
          output = result.stdout + result.stderr
          print(output)
          if result.returncode or 'Warning:' in output or 'Dafny auditor completed with 0 findings' not in output:
              raise SystemExit('Polynomial assumption audit failed')
          PY
          mkdir -p target/dafny-crypto-polynomial
          CRYPTO_POLY_OUTPUT=$(mktemp -d target/dafny-crypto-polynomial/replay-XXXXXX)
          python formal/crypto/polynomial_checks.py --phase all --dafny "$DAFNY_CRYPTO_TOOL" --output "$CRYPTO_POLY_OUTPUT" --java-home "$CRYPTO_JAVA_21" --runtime-home "$JAVA_HOME"
