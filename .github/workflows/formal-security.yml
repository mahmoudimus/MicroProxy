name: Scoped security proofs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dafny-native-codec-sampling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain JDK 21 for compilation and replay
        run: echo "CRYPTO_JAVA_21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify native array, arithmetic, cleanup and generated-code gates
        run: |
          DAFNY_CRYPTO_TOOL=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          mvn -q dependency:get -Dartifact=org.dafny:DafnyRuntime:4.9.1
          python formal/crypto/native_codec_checks.py --dafny "$DAFNY_CRYPTO_TOOL" --runtime "$HOME/.m2/repository/org/dafny/DafnyRuntime/4.9.1/DafnyRuntime-4.9.1.jar" --output target/dafny-native-codec --java-home "$CRYPTO_JAVA_21" --java-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-native-codec-sampling-jdk-21-and-25
          path: target/dafny-native-codec/
          if-no-files-found: ignore

  dafny-kem-composition:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain JDK 21 for compilation and replay
        run: echo "CRYPTO_JAVA_21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify full KEM graph, reject controls and test both JDKs
        run: |
          DAFNY_CRYPTO_TOOL=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          python formal/crypto/kem_checks.py --scope full --dafny "$DAFNY_CRYPTO_TOOL" --output target/dafny-crypto-kem --java-home "$CRYPTO_JAVA_21" --java-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-kem-composition-jdk-21-and-25
          path: target/dafny-crypto-kem/
          if-no-files-found: ignore

  dafny-polynomial:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain JDK 21 for compilation and replay
        run: echo "CRYPTO_JAVA_21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Audit, prove polynomial algebra and test both JDKs
        run: |
          DAFNY_CRYPTO_TOOL=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          python - "$DAFNY_CRYPTO_TOOL" <<'PY'
          import subprocess, sys
          result = subprocess.run([sys.argv[1], 'audit', 'formal/crypto/Polynomial.dfy'], text=True, capture_output=True)
          output = result.stdout + result.stderr
          print(output)
          if result.returncode or 'Warning:' in output or 'Dafny auditor completed with 0 findings' not in output:
              raise SystemExit('Polynomial assumption audit failed')
          PY
          mkdir -p target/dafny-crypto-polynomial
          CRYPTO_POLY_OUTPUT=$(mktemp -d target/dafny-crypto-polynomial/replay-XXXXXX)
          python formal/crypto/polynomial_checks.py --phase all --dafny "$DAFNY_CRYPTO_TOOL" --output "$CRYPTO_POLY_OUTPUT" --java-home "$CRYPTO_JAVA_21" --runtime-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-polynomial-jdk-21-and-25
          path: target/dafny-crypto-polynomial/
          if-no-files-found: ignore

  dafny-shake-api:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
      - name: Retain JDK 21 for compilation and replay
        run: echo "CRYPTO_JAVA_21=$JAVA_HOME" >> "$GITHUB_ENV"
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '25'
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify SHAKE API, reject controls and test both JDKs
        run: python formal/crypto/shake_checks.py --output target/dafny-crypto-shake --java-home "$CRYPTO_JAVA_21" --java-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-shake-api-jdk-21-and-25
          path: target/dafny-crypto-shake/
          if-no-files-found: ignore

  dafny-codec-sampling:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify codecs and finite sampling, reject controls and test Java
        run: |
          DAFNY_CRYPTO_TOOL=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          python formal/crypto/codec_sampling_checks.py --dafny "$DAFNY_CRYPTO_TOOL" --output target/dafny-crypto-codec --java-home "$JAVA_HOME"
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-codec-sampling-jdk-${{ matrix.java }}
          path: target/dafny-crypto-codec/
          if-no-files-found: ignore

  dafny-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test primitive replay trust gates
        run: python -m unittest discover -s formal/primitives -p 'test_*.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify kernels, reject controls and test generated Java
        run: python formal/primitives/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-primitives-jdk-${{ matrix.java }}
          path: target/dafny-primitives/
          if-no-files-found: ignore

  packet-traces:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test packet proof and code-bridge gates
        run: python -m unittest discover -s formal/packet -p 'test_*.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Replay scalar proofs, negative controls and actual-class traces
        run: python formal/packet/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: packet-traces-jdk-${{ matrix.java }}
          path: target/packet-verification/
          if-no-files-found: ignore

  dafny-hkdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test fail-closed HKDF replay gates
        run: python -m unittest discover -s formal/dafny -p 'test_run.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify, audit, generate Java and test JCE integration
        run: python formal/dafny/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-hkdf-jdk-${{ matrix.java }}
          path: target/dafny-hkdf/
          if-no-files-found: ignore

  formal-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test the proof runner's trust gates
        run: |
          python -m unittest discover -s scripts/security -p 'test_formal_tools.py' -v
          python -m unittest discover -s formal/saw -p 'test_*.py' -v
      - name: Install checksum-pinned Lean and TLC outside the checkout
        run: |
          command -v zstd || (sudo apt-get update && sudo apt-get install --yes zstd)
          python scripts/security/install_formal_tools.py
      - name: Replay proofs, Java observations, finite models and negative controls
        run: python scripts/security/formal_check.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: formal-security-evidence
          path: |
            target/formal-security/*.log
            target/formal-security/report.json
            target/formal-security/observations/*.jsonl
            target/formal-security/JavaObservations.lean
          if-no-files-found: ignore
