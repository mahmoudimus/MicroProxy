    timeout-minutes: 20
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test fail-closed HKDF replay gates
        run: python -m unittest discover -s formal/dafny -p 'test_run.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify, audit, generate Java and test JCE integration
        run: python formal/dafny/run.py
      - name: Replay the pinned AWS HKDF target and preserve its explicit graph boundary
        if: matrix.java == '21'
        run: |
          AWS_HKDF_REFERENCE="$RUNNER_TEMP/aws-hkdf-reference"
          git init --quiet "$AWS_HKDF_REFERENCE"
          git -C "$AWS_HKDF_REFERENCE" fetch --quiet --depth 1 https://github.com/aws/aws-cryptographic-material-providers-library.git c787ad12612ac0f35975afe9209e5dbe6b546654
          git -C "$AWS_HKDF_REFERENCE" checkout --quiet --detach FETCH_HEAD
          git -C "$AWS_HKDF_REFERENCE" submodule update --init --depth 1 libraries smithy-dafny
          AWS_HKDF_DAFNY=$(python -c 'import sys; from pathlib import Path; sys.path.insert(0,"formal/dafny"); import toolchain; print(toolchain.install(Path.home()/".cache/microproxy-formal")[0])')
          python formal/reference/aws-hkdf/replay.py --checkout "$AWS_HKDF_REFERENCE" --dafny "$AWS_HKDF_DAFNY" --scope target --output target/dafny-hkdf/upstream-reference
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-hkdf-jdk-${{ matrix.java }}
          path: target/dafny-hkdf/
          if-no-files-found: ignore

