name: Scoped security proofs

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  dafny-primitives:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test primitive replay trust gates
        run: python -m unittest discover -s formal/primitives -p 'test_*.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify kernels, reject controls and test generated Java
        run: python formal/primitives/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-primitives-jdk-${{ matrix.java }}
          path: target/dafny-primitives/
          if-no-files-found: ignore

  packet-traces:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test packet proof and code-bridge gates
        run: python -m unittest discover -s formal/packet -p 'test_*.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Replay scalar proofs, negative controls and actual-class traces
        run: python formal/packet/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: packet-traces-jdk-${{ matrix.java }}
          path: target/packet-verification/
          if-no-files-found: ignore

  dafny-hkdf:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    strategy:
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test fail-closed HKDF replay gates
        run: python -m unittest discover -s formal/dafny -p 'test_run.py' -v
      - name: Install Dafny's Linux globalization dependency
        run: sudo apt-get update && sudo apt-get install --yes libicu74
      - name: Verify, audit, generate Java and test JCE integration
        run: python formal/dafny/run.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: dafny-hkdf-jdk-${{ matrix.java }}
          path: target/dafny-hkdf/
          if-no-files-found: ignore

  formal-security:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Test the proof runner's trust gates
        run: |
          python -m unittest discover -s scripts/security -p 'test_formal_tools.py' -v
          python -m unittest discover -s formal/saw -p 'test_*.py' -v
      - name: Install checksum-pinned Lean and TLC outside the checkout
        run: |
          command -v zstd || (sudo apt-get update && sudo apt-get install --yes zstd)
          python scripts/security/install_formal_tools.py
      - name: Replay proofs, Java observations, finite models and negative controls
        run: python scripts/security/formal_check.py
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: formal-security-evidence
          path: |
            target/formal-security/*.log
            target/formal-security/report.json
            target/formal-security/observations/*.jsonl
            target/formal-security/JavaObservations.lean
          if-no-files-found: ignore
