name: Maven Central

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
    secrets:
      MAVEN_CENTRAL_USERNAME:
        required: true
      MAVEN_CENTRAL_PASSWORD:
        required: true
      MAVEN_GPG_PRIVATE_KEY:
        required: true
      MAVEN_GPG_PASSPHRASE:
        required: true
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag containing the Central profile (e.g. v0.1.1)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: central-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check release tag and credentials
        env:
          TAG: ${{ inputs.tag }}
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_PRIVATE_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: |
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo 'Expected a stable vX.Y.Z release tag'; exit 1; }
          for name in MAVEN_CENTRAL_USERNAME MAVEN_CENTRAL_PASSWORD MAVEN_GPG_PRIVATE_KEY MAVEN_GPG_PASSPHRASE; do
            [[ -n "${!name}" ]] || { echo "Missing Actions secret: $name"; exit 1; }
          done
      - uses: actions/checkout@v7.0.1
        with:
          ref: refs/tags/${{ inputs.tag }}
          persist-credentials: false
      - name: Verify release version
        env:
          TAG: ${{ inputs.tag }}
        run: |
          python3 - <<'PY'
          import os
          import xml.etree.ElementTree as ET
          root = ET.parse('pom.xml').getroot()
          ns = {'m': 'http://maven.apache.org/POM/4.0.0'}
          version = root.findtext('m:version', namespaces=ns)
          if version != os.environ['TAG'][1:]:
              raise SystemExit(f'Tag/POM version mismatch: {version}')
          if root.find("m:profiles/m:profile[m:id='central']", ns) is None:
              raise SystemExit('This release predates the Central publishing profile')
          PY
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          server-id: central
          server-username-env-var: MAVEN_CENTRAL_USERNAME
          server-password-env-var: MAVEN_CENTRAL_PASSWORD
      - name: Install Maven 3.9.16 for Central publishing
        # Maven 3.10 writes maven-metadata-local.xml into the publishing plugin's
        # bundle. Central rejects those files outside version directories.
        run: |
          curl --fail --silent --show-error --location \
            https://repo.maven.apache.org/maven2/org/apache/maven/apache-maven/3.9.16/apache-maven-3.9.16-bin.tar.gz \
            --output "$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz"
          echo "831a8591fe20c8243b1dbe7d71e3244f31d1665b0804b2e825e38cbbe5ce0cafb8338851f90780735568773e0a6cd07bbec107cda0b896b008b861075358b6f6  $RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz" | sha512sum --check
          tar -xzf "$RUNNER_TEMP/apache-maven-3.9.16-bin.tar.gz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/apache-maven-3.9.16/bin" >> "$GITHUB_PATH"
      - name: Report publishing toolchain
        run: mvn --version
      - name: Build, sign, and publish
        env:
          MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
          MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}
          MAVEN_GPG_KEY: ${{ secrets.MAVEN_GPG_PRIVATE_KEY }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.MAVEN_GPG_PASSPHRASE }}
        run: mvn --batch-mode -Pcentral deploy
