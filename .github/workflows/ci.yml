name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        java: ['21', '25']
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn --batch-mode verify

  h2spec:
    # HTTP/2 conformance (h2spec, pinned) against the proxy's h2c listener: shared with HTTP/1, and
    # h2c-only (--http2-cleartext-only).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the proxy and its test classes
        run: mvn --batch-mode -q -DskipTests test-compile -pl microproxy -am
      - name: Run h2spec
        # Every case except http2/3.5/2 (an invalid connection preface): the h2c listener is
        # shared with HTTP/1, so a connection that does not start with the preface is answered as
        # HTTP/1. See docs/guides/http2.md (Conformance).
        run: .github/scripts/h2spec.sh --strict generic http2/3.5/1 http2/4 http2/5 http2/6 http2/7 http2/8 hpack
      - name: Run h2spec against an h2c-only listener
        # Every case: a connection that does not start with the preface is a connection error there.
        if: ${{ !cancelled() }}
        env:
          H2SPEC_TARGET_OPTS: -Dh2spec.cleartextOnly=true
          H2SPEC_REPORT: h2spec-cleartext-only-report.xml
        run: .github/scripts/h2spec.sh --strict
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: h2spec-report
          path: |
            h2spec-report.xml
            h2spec-cleartext-only-report.xml
          if-no-files-found: ignore

  quic-interop:
    # QUIC and HTTP/3 interoperability with aioquic (pinned): as client and as server of the Java
    # QUIC stack, session resumption with 0-RTT each way, connection migration each way (aioquic's
    # client moving to a new port mid-transfer, the Java client rebinding against aioquic's server,
    # whose probe aioquic never answers on any path, checked from its qlog), and on either side of the proxy's HTTP/3
    # (reverse mode, upstream, scripts, transparent QUIC, intercepted and relayed, the forward
    # proxy's CONNECT, WebSockets and CONNECT-UDP, raw QUIC through the QUIC stream hooks,
    # redirected and inside CONNECT-UDP, and DNS over QUIC through the message hooks). Also
    # opentelemetry-proto's generated classes (pinned) decoding the OTLP the proxy exports.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install aioquic and opentelemetry-proto
        # Into the runner's Python, outside the repository; pip keeps its cache in the home directory
        run: python -m pip install aioquic==1.4.0 opentelemetry-proto==1.45.1
      - name: Run the interop tests
        run: >-
          mvn --batch-mode -pl quic,microproxy,microproxy-otel,microproxy-starlark -am verify
          -Dtest=AioquicInteropTest,AioquicHttp3Test,AioquicTransparentQuicTest,AioquicMasqueTest,AioquicQuicStreamsTest,AioquicDoqTest,ScriptedHttp3Test,OtlpInteropTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dquic.interop.python=python -Dquic.interop.required=true
          -Dotel.interop.python=python -Dotel.interop.required=true

  grpc-interop:
    # gRPC between real peers, grpcio's client and server (pinned), through the intercepting proxy
    # with HTTP/2 on both sides (--mitm --http2 --http2-upstream): the client reaches the server
    # with CONNECT through the forward proxy. Unary, server, client and bidirectional streaming,
    # an error with grpc-status-details-bin, a deadline and a cancellation reaching the server,
    # messages of several megabytes; plain, through a Java frame interceptor and through a
    # Starlark on_frame script, both passing every frame on unchanged.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install grpcio
        # Into the runner's Python, outside the repository; pip keeps its cache in the home directory
        run: python -m pip install grpcio==1.84.0
      - name: Run the gRPC interop tests
        run: >-
          mvn --batch-mode -pl microproxy,microproxy-starlark -am verify
          -Dtest=GrpcInteropTest,ScriptedGrpcInteropTest
          -Dsurefire.failIfNoSpecifiedTests=false
          -Dgrpc.interop.python=python -Dgrpc.interop.required=true

  bench-smoke:
    # The JMH benchmarks of MicroProxy against LittleProxy (benchmarks/, built only with -Pbench),
    # every benchmark run once with small parameters (-f 1 -wi 0 -i 1 -r 1s): a check that each
    # one works against both proxies, whose responses are all validated, not a measurement
    # (runners are too noisy for that; see docs/project/benchmarks.md). Then the footprint
    # harness, also small.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the benchmarks
        run: mvn --batch-mode -Pbench -DskipTests package -pl benchmarks -am
      - name: Run every benchmark once against both proxies
        run: benchmarks/run.sh smoke
        env:
          RESULTS_DIR: bench-results
      - name: Run the footprint harness
        run: java -cp benchmarks/target/benchmarks.jar org.microproxy.bench.Footprint --connections 100
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: bench-smoke
          path: bench-results/
          if-no-files-found: ignore

  loadtest-smoke:
    # The system-level load and capacity harness (loadtest/, built only with -Pbench) run with its
    # smoke preset against both proxies: a check that every scenario runs, responses validate and
    # the JSON and Markdown reports are produced. Thresholds are not checked here; GitHub runners
    # are too noisy (see docs/project/load-testing.md). The job fails on a failed harness self-check,
    # or on a failed verdict on MicroProxy (out of memory, a crash, a fault that hung or leaked);
    # the smoke windows are too short for growth or leak verdicts, which are inconclusive here.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the harness
        run: mvn --batch-mode -Pbench -DskipTests package -pl loadtest -am
      - name: Run the smoke preset against both proxies
        # The smoke preset needs about 2,500 descriptors per process, under a hosted runner's
        # default. Raising the soft limit to the hard one never needs privileges; going past the
        # hard limit does, and is not attempted. The exit code gates on the harness's self-checks
        # and MicroProxy's verdicts (--gate microproxy, the default); LittleProxy's verdicts are
        # comparison data and appear in the summary below.
        run: |
          ulimit -n "$(ulimit -Hn)" 2>/dev/null || true
          echo "Open-file limit: soft $(ulimit -n), hard $(ulimit -Hn)"
          java -jar loadtest/target/microproxy-loadtest.jar run --preset smoke --gate microproxy
      - name: Add the report to the job summary
        if: always()
        run: |
          report=loadtest/results/latest/report.md
          if [ -f "$report" ]; then cat "$report" >> "$GITHUB_STEP_SUMMARY"; fi
      - uses: actions/upload-artifact@v7.0.2
        if: always()
        with:
          name: loadtest-smoke
          path: loadtest/results/
          if-no-files-found: ignore

  central-artifacts:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build sources and Javadoc for Maven Central
        run: mvn --batch-mode -Pcentral -Dgpg.skip=true -DskipTests verify

  docs:
    # The documentation site: MkDocs Material (pinned in docs/requirements.txt) in strict mode, so a
    # broken link or anchor fails; the links of the Markdown outside docs/; and llms.txt, which the
    # build writes with llms-full.txt (docs/llms.txt is the committed copy, which must be current).
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned documentation tools
        # Into the runner's Python, outside the repository; pip keeps its cache in the home directory
        run: python -m pip install -r docs/requirements.txt
      - name: Check that docs/llms.txt is current
        run: python docs/scripts/gen_llms.py check
      - name: Build the site
        run: mkdocs build --strict
      - name: Check that llms.txt and llms-full.txt were generated
        run: test -s site/llms.txt && test -s site/llms-full.txt
      - name: Check the links of every Markdown file
        run: python docs/scripts/check_links.py

  api-docs:
    # The aggregated Javadoc that docs.yml publishes under /api/ on the documentation site.
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Build the modules
        run: mvn --batch-mode -DskipTests install
      - name: Build the aggregated Javadoc
        run: mvn --batch-mode javadoc:aggregate-no-fork@api-docs -Dmaven.javadoc.skip=true
