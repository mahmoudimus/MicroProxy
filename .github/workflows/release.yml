name: Release

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-24.04
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v5.0.0
        id: release
        with:
          # Pull requests opened with the default token do not start CI; a personal access token
          # in RELEASE_PLEASE_TOKEN makes CI run on release pull requests too.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  jars:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - run: mvn --batch-mode verify
      - name: Attach jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.release-please.outputs.tag_name }}
        run: |
          mkdir dist
          cp zstd-decoder/target/zstd-decoder-*.jar \
             http2-codec/target/http2-codec-*.jar \
             microproxy/target/microproxy-*.jar \
             microproxy-starlark/target/microproxy-starlark-*.jar dist/
          rm -f dist/*-tests.jar
          (cd dist && sha256sum ./*.jar > SHA256SUMS)
          gh release upload "$TAG" dist/* --clobber

  central:
    needs: [release-please, jars]
    if: needs.release-please.outputs.release_created == 'true'
    uses: ./.github/workflows/central.yml
    with:
      tag: ${{ needs.release-please.outputs.tag_name }}
    secrets: inherit
