name: Docs

# Builds the documentation site (MkDocs, from docs/ and mkdocs.yml) with the aggregated Javadoc
# under /api/, and deploys it to GitHub Pages: https://mahmoudimus.github.io/MicroProxy/
# The repository's Pages source must be set to "GitHub Actions" (Settings > Pages).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# One deployment at a time; a newer push waits for the one in progress rather than cancelling it.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - uses: actions/setup-python@v6.0.0
        with:
          python-version: '3.13'
      - name: Install the pinned documentation tools
        run: python -m pip install -r docs/requirements.txt
      - name: Build the site, with llms.txt and llms-full.txt
        run: mkdocs build --strict
      - name: Build the modules
        run: mvn --batch-mode -DskipTests install
      - name: Build the aggregated Javadoc
        run: mvn --batch-mode javadoc:aggregate-no-fork@api-docs -Dmaven.javadoc.skip=true
      - name: Add the Javadoc to the site under /api/
        run: |
          test -s target/reports/apidocs/index.html
          cp -r target/reports/apidocs site/api
          test -s site/llms.txt && test -s site/llms-full.txt
      - uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5.0.1
