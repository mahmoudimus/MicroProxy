# Squid as a plain HTTP forward proxy for the load-testing comparison (docs/project/performance.md).
# A template: the harness replaces 27845, 70 and
# 40. Squid runs as one process in the foreground (squid -N: no SMP workers, no
# coordinator), with caching, the access log and the disk store off, the same idle and connect
# timeouts as the other proxies and the same Via alias.
http_port 127.0.0.1:27845
workers 1
visible_hostname loadtest
acl loopback src 127.0.0.0/8
http_access allow loopback
http_access deny all

# No caching: neither memory nor disk, and nothing stored.
cache deny all
cache_mem 0 MB
access_log none
cache_store_log none
logfile_rotate 0
# Squid drops root privileges to its own user, so its log goes to standard error (squid -d 1) rather
# than to a file under the harness's directory.
cache_log /dev/null
debug_options ALL,1
pid_filename none
coredump_dir none
pinger_enable off

# Timeouts as the other proxies: idle connections on both sides, upstream connect, and reads.
client_idle_pconn_timeout 70 seconds
pconn_timeout 70 seconds
read_timeout 70 seconds
connect_timeout 40 seconds
request_timeout 70 seconds
shutdown_lifetime 1 seconds
