# Envoy as a plain HTTP forward proxy for the load-testing comparison (docs/project/performance.md).
# A template: the harness replaces 38063, 70 and 40 and writes
# the result next to the run's logs; the worker count is --concurrency on the command line
# (proxies.json), one worker per CPU the proxy is pinned to.
#
# The dynamic forward proxy filter and cluster resolve each request's host (absolute-form requests,
# whose authority becomes the Host) through a DNS cache; CONNECT is upgraded and tunnelled.
# Settings beyond the defaults, and why:
#   - no access log and no admin listener (Envoy's statistics cannot be turned off);
#   - generate_request_id off and suppress_envoy_headers on: no x-request-id or x-envoy-* work that
#     the other proxies do not do;
#   - the route timeout off (Envoy's default is 15 s for the whole response), leaving the same idle
#     timeout as the other proxies; otherwise slow readers would be cut off at 15 s;
#   - circuit-breaker thresholds raised from 1024 to 1,000,000: the defaults are a service-mesh safety
#     valve that none of the other proxies has, and would reject load the others accept.
# Buffer limits keep Envoy's defaults (1 MiB per connection; its edge-proxy guide suggests 32 KiB).
static_resources:
  listeners:
    - name: forward_proxy
      address:
        socket_address: { address: 127.0.0.1, port_value: 38063 }
      filter_chains:
        - filters:
            - name: envoy.filters.network.http_connection_manager
              typed_config:
                "@type": type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
                stat_prefix: forward_proxy
                codec_type: HTTP1
                generate_request_id: false
                stream_idle_timeout: 70s
                # The whole request head, first byte to last (Envoy has no limit by default)
                request_headers_timeout: 70s
                common_http_protocol_options:
                  idle_timeout: 70s
                http_protocol_options:
                  allow_absolute_url: true
                upgrade_configs:
                  - upgrade_type: CONNECT
                route_config:
                  name: all
                  virtual_hosts:
                    - name: all
                      domains: ["*"]
                      routes:
                        - match: { connect_matcher: {} }
                          route:
                            cluster: dynamic_forward_proxy
                            timeout: 0s
                            upgrade_configs:
                              - upgrade_type: CONNECT
                                connect_config: {}
                        - match: { prefix: "/" }
                          route:
                            cluster: dynamic_forward_proxy
                            timeout: 0s
                http_filters:
                  - name: envoy.filters.http.dynamic_forward_proxy
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.dynamic_forward_proxy.v3.FilterConfig
                      dns_cache_config:
                        name: dynamic_forward_proxy_cache
                        dns_lookup_family: V4_ONLY
                  - name: envoy.filters.http.router
                    typed_config:
                      "@type": type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
                      suppress_envoy_headers: true
  clusters:
    - name: dynamic_forward_proxy
      connect_timeout: 40s
      lb_policy: CLUSTER_PROVIDED
      typed_extension_protocol_options:
        envoy.extensions.upstreams.http.v3.HttpProtocolOptions:
          "@type": type.googleapis.com/envoy.extensions.upstreams.http.v3.HttpProtocolOptions
          # Required on a dynamic forward proxy cluster; they apply to TLS upstreams only.
          upstream_http_protocol_options:
            auto_sni: true
            auto_san_validation: true
          common_http_protocol_options:
            idle_timeout: 70s
          explicit_http_config:
            http_protocol_options: {}
      circuit_breakers:
        thresholds:
          - priority: DEFAULT
            max_connections: 1000000
            max_pending_requests: 1000000
            max_requests: 1000000
            max_retries: 1000000
      cluster_type:
        name: envoy.clusters.dynamic_forward_proxy
        typed_config:
          "@type": type.googleapis.com/envoy.extensions.clusters.dynamic_forward_proxy.v3.ClusterConfig
          dns_cache_config:
            name: dynamic_forward_proxy_cache
            dns_lookup_family: V4_ONLY
